[project]
name = "detect_system_prompt_leakage"
version = "0.0.0"
description = "A validator that checks for system prompt leakage in LLM output."
authors = [
    {name = "Guardrails AI", email = "contact@guardrailsai.com"}
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">= 3.10"
dependencies = [
    "guardrails-ai>=0.4.0",
    "RapidFuzz>=3.14.5"
]

[project.optional-dependencies]
dev = [
    "pyright",
    "pytest",
    "ruff",
    "datasets"
] 

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-rP"
testpaths = [
    "tests"
]

[tool.pyright]
include = ["validator"]